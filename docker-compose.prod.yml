version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aziz_lms_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-lms_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_prod_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aziz_lms_prod_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-prod_secure_password_123}@postgres:5432/${POSTGRES_DB:-lms_prod}?schema=public
      JWT_SECRET: ${JWT_SECRET:-production_super_secret_jwt_key_at_least_32_chars_long}
      TRUSTED_PROXY_HOPS: 1
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-memory}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - lms_prod_network

volumes:
  postgres_prod_data:
    driver: local

networks:
  lms_prod_network:
    driver: bridge
