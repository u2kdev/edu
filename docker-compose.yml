version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aziz-lms-postgres
    environment:
      POSTGRES_USER: aziz
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: aziz_lms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
