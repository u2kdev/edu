services:
  postgres-test:
    image: postgres:16-alpine
    container_name: aziz_lms_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lms_integration
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_integration"]
      interval: 2s
      timeout: 3s
      retries: 15
