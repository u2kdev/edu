name: CI

on:
  push:
    branches:
      - feature/lms-upgrade
      - main
  pull_request:
    branches:
      - feature/lms-upgrade
      - main

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/lms_test?schema=public"
      JWT_SECRET: "ci-dummy-jwt-secret-key-32-chars-long!"
      DEV_LOGIN: "false"
      DEV_EMAIL_LOG: "false"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Migrations
        run: npx prisma migrate deploy

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run Tests (vitest)
        run: npx vitest run

      - name: Build Application
        run: npm run build
